services:
  evolution_api:
    image: evoapicloud/evolution-api:latest # Versión más reciente de Evolution API
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      # Seguridad: Esta llave la usarás en tu bot para hablar con la API
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=tu_super_clave_secreta_123
      - AUTHENTICATION_EXPOSE_IN_REQ=true
      # Base de datos (Evolution API necesita su propia DB)
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@evolution_db:5432/evolution?schema=public
      # Redis (Mejora el rendimiento)
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution_redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
    depends_on:
      - evolution_db
      - evolution_redis
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

  evolution_db:
    image: postgres:15-alpine
    container_name: evolution_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
    ports:
      - "5433:5432" # Expuesto en 5433 para no chocar si ya tienes postgres local
    volumes:
      - evolution_db_data:/var/lib/postgresql/data

  evolution_redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - evolution_redis_data:/data

volumes:
  evolution_instances:
  evolution_store:
  evolution_db_data:
  evolution_redis_data:
